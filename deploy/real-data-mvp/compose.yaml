name: real-data-mvp-${MVP_PROJECT_NAME:?必须提供唯一的隔离项目后缀}
services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MVP_MYSQL_ROOT_PASSWORD:?隔离 MySQL root 密码缺失}
      MYSQL_DATABASE: f1_ai_predict
      MYSQL_USER: ${MVP_MYSQL_USER:?隔离 MySQL 用户缺失}
      MYSQL_PASSWORD: ${MVP_MYSQL_PASSWORD:?隔离 MySQL 密码缺失}
    ports:
      - "127.0.0.1:13316:3306"
    volumes:
      - real_data_mvp_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    labels:
      org.f1predict.scope: isolated-real-data-mvp
      org.f1predict.project: real-data-mvp-${MVP_PROJECT_NAME:?必须提供唯一的隔离项目后缀}
  rabbitmq:
    image: rabbitmq:4.1.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ${MVP_RABBIT_USER:?隔离 RabbitMQ 用户缺失}
      RABBITMQ_DEFAULT_PASS: ${MVP_RABBIT_PASSWORD:?隔离 RabbitMQ 密码缺失}
      RABBITMQ_DEFAULT_VHOST: /f1predict-mvp
    ports:
      - "127.0.0.1:15683:5672"
      - "127.0.0.1:15682:15672"
    volumes:
      - real_data_mvp_rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    labels:
      org.f1predict.scope: isolated-real-data-mvp
      org.f1predict.project: real-data-mvp-${MVP_PROJECT_NAME:?必须提供唯一的隔离项目后缀}
volumes:
  real_data_mvp_mysql:
  real_data_mvp_rabbit:
