spring:
  application:
    name: f1aipredict

---
# 只有非测试环境才从 Nacos 加载业务配置，避免测试引导阶段访问远端服务。
spring:
  config:
    activate:
      on-profile: "!test"
    import: "nacos:${NACOS_DATA_ID:f1_ai_predict.yaml}?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=false"
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
