# F1 AI Predict Python Worker 工程清单：定义包元数据、构建后端与依赖。
# HTTP 骨架与独立 RabbitMQ 消费进程共用此包。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-predict"
version = "0.1.0"
description = "F1 AI Predict Python Worker 工程骨架"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4,<10",
    "fastapi",
    "httpx>=0.28.1",
    "openai>=2.11.0",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "uvicorn",
]

[project.optional-dependencies]
# DeepSeek 官方示例使用 OpenAI 兼容 SDK；仅显式安装本额外依赖时提供真实客户端。
deepseek = [
    "openai==2.11.0",
    "httpx>=0.28.1,<0.29",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/f1_predict"]

[tool.mypy]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
